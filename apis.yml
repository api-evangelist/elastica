name: Elastica
description: >-
  Elastica was a Silicon Valley cloud security startup that pioneered the Cloud
  Access Security Broker (CASB) category, using data science and machine
  learning to give enterprises visibility into and control over Shadow IT and
  sanctioned SaaS applications. Its CloudSOC platform combined an API-based
  control mode (connecting directly to cloud apps such as Office 365, Box,
  Salesforce, and Google Workspace) with an inline gateway mode for
  data-loss-prevention, threat detection, and compliance. Backed by Mayfield,
  Pelion Venture Partners, and Third Point Ventures, Elastica was acquired by
  Blue Coat Systems for $280 million in November 2015; Blue Coat (with Elastica
  and Perspecsys) was in turn acquired by Symantec in 2016, where the technology
  became the Symantec CloudSOC CASB, later part of Broadcom's enterprise
  security portfolio. Elastica no longer operates as an independent company and
  publishes no active public developer surface, API, or SDK.
